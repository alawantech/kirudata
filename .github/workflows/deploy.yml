name: Deploy Guchor Data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.GUCHOR_SERVER_HOST }}
          SSH_USER: ${{ secrets.GUCHOR_SERVER_USER }}
          SSH_KEY: ${{ secrets.GUCHOR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} << 'REMOTE'
            cd /var/www/guchor-monie
            git config --global --add safe.directory /var/www/guchor-monie
            git pull origin main
            cd backend
            npx prisma db push --skip-generate && npx prisma generate
            cd ../frontend
            npm run build
            cd ..
            pm2 restart guchor-backend
            pm2 restart frontend
            echo "=== Deploy Complete ==="
            pm2 list
          REMOTE
